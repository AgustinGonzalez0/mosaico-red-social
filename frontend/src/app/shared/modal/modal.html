@if (modal.actual(); as m) {
  <div class="backdrop" (click)="modal.cerrar()">
    <div
      class="dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-titulo"
      aria-describedby="modal-mensaje"
      (click)="$event.stopPropagation()"
      (keydown.tab)="atraparFoco($event, false)"
      (keydown.shift.tab)="atraparFoco($event, true)"
    >
      <div class="icono" [class]="m.tipo" aria-hidden="true">
        @switch (m.tipo) {
          @case ('exito') { ✓ }
          @case ('error') { ! }
          @case ('confirmar') { ? }
          @default { i }
        }
      </div>
      <h2 id="modal-titulo">{{ m.titulo }}</h2>
      <p id="modal-mensaje">{{ m.mensaje }}</p>
      <div class="acciones">
        @if (m.textoCancelar; as cancelar) {
          <button #cancelar type="button" class="btn" (click)="modal.cerrar()">{{ cancelar }}</button>
        }
        <button #boton type="button" class="btn primary" (click)="modal.cerrar(true)">
          {{ m.textoBoton ?? 'Entendido' }}
        </button>
      </div>
    </div>
  </div>
}

$kind: http-request
description: Devuelve datos del administrador si el JWT está vigente.
url: https://mosaico-api-oejm.onrender.com/auth/autorizar
method: POST
headers:
  Authorization: Bearer {{adminToken}}
scripts:
  - type: afterResponse
    code: 'pm.test("JWT válido: 200", () => pm.response.to.have.status(200));'
    language: text/javascript
order: 2000

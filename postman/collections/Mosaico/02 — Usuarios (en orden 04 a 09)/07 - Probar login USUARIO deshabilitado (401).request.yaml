$kind: http-request
description: Ejecutar después de 06 y antes de 08. No usa token; comprueba rechazo de login.
url: https://mosaico-api-oejm.onrender.com/auth/login
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "usuario": "{{demoUsuario}}",
      "password": "Prueba123!"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Usuario deshabilitado: 401", () => pm.response.to.have.status(401));
      if (pm.response.code === 401) pm.test('Mensaje de cuenta deshabilitada', () => pm.expect(JSON.stringify(pm.response.json()).toLowerCase()).to.include('deshabilitada'));
    language: text/javascript
order: 4000

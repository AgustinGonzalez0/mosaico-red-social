$kind: http-request
url: https://mosaico-api-oejm.onrender.com/estadisticas/publicaciones-por-usuario?desde={{fechaDesde}}&hasta={{fechaHasta}}
method: GET
headers:
  Authorization: Bearer {{usuarioToken}}
queryParams:
  desde: "{{fechaDesde}}"
  hasta: "{{fechaHasta}}"
scripts:
  - type: afterResponse
    code: 'pm.test("Usuario normal: 403", () => pm.response.to.have.status(403));'
    language: text/javascript
order: 5000

$kind: http-request
description: "OPCIONAL Y DESTRUCTIVA: no ejecutes esta request si no creaste antes una publicación específicamente para pruebas y configuraste publicacionPruebaId."
url: https://mosaico-api-oejm.onrender.com/publicaciones/{{publicacionPruebaId}}
method: DELETE
headers:
  Authorization: Bearer {{adminToken}}
scripts:
  - type: afterResponse
    code: 'pm.test("Baja lógica de publicación: 204", () => pm.response.to.have.status(204));'
    language: text/javascript
order: 2000
